<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="draft 接受率对比：散文任务两个模型都约 38%，代码任务两个模型都约 76%，差异来自任务类型而非权重">
<style>
  .surface { fill: #fcfcfb; }
  .tp { fill: #0b0b0b; }
  .ts { fill: #52514e; }
  .tm { fill: #7a7873; }
  .grid { stroke: #e5e4e0; stroke-width: 1; }
  .axis { stroke: #c9c7c1; stroke-width: 1; }
  .s1 { fill: #2a78d6; }
  .s2 { fill: #eb6834; }
  .div { stroke: #c9c7c1; stroke-width: 1; stroke-dasharray: 4 4; }
  text { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .tp { fill: #ffffff; }
    .ts { fill: #c3c2b7; }
    .tm { fill: #9b998f; }
    .grid { stroke: #2e2e2c; }
    .axis { stroke: #46453f; }
    .s1 { fill: #3987e5; }
    .s2 { fill: #d95926; }
    .div { stroke: #46453f; }
  }
</style>
<rect class="surface" width="720" height="340" rx="6"/>
<text class="tp" x="24" y="32" font-size="15" font-weight="600">draft 接受率取决于任务类型，而非权重是否被改造</text>
<text class="ts" x="24" y="52" font-size="12">同一个草稿模型 z-lab/Qwen3.8-27B-DFlash2，对两种目标权重</text>

<rect class="s1" x="470" y="24" width="10" height="10" rx="2"/>
<text class="ts" x="486" y="33" font-size="12">Uncensored（改造过）</text>
<rect class="s2" x="622" y="24" width="10" height="10" rx="2"/>
<text class="ts" x="638" y="33" font-size="12">官方 4-bit</text>

<g>
  <line class="grid" x1="80" y1="260" x2="690" y2="260"/>
  <line class="grid" x1="80" y1="212" x2="690" y2="212"/>
  <line class="grid" x1="80" y1="164" x2="690" y2="164"/>
  <line class="grid" x1="80" y1="116" x2="690" y2="116"/>
  <text class="tm" x="72" y="264" font-size="11" text-anchor="end">0%</text>
  <text class="tm" x="72" y="216" font-size="11" text-anchor="end">25%</text>
  <text class="tm" x="72" y="168" font-size="11" text-anchor="end">50%</text>
  <text class="tm" x="72" y="120" font-size="11" text-anchor="end">75%</text>
</g>
<line class="axis" x1="80" y1="260" x2="690" y2="260"/>
<line class="div" x1="385" y1="76" x2="385" y2="270"/>

<!-- y = 260 - pct*1.92 -->
<!-- 散文: 37.8 / 38.0 -->
<rect class="s1" x="150" y="187.4" width="60" height="72.6" rx="4"/>
<rect class="s2" x="212" y="187.0" width="60" height="73.0" rx="4"/>
<text class="tp" x="180" y="180" font-size="12" text-anchor="middle">37.8%</text>
<text class="tp" x="242" y="180" font-size="12" text-anchor="middle">38%</text>
<text class="ts" x="211" y="284" font-size="12" text-anchor="middle">开放式中文散文</text>
<text class="tm" x="211" y="302" font-size="11" text-anchor="middle">每轮仅产出 1.61 token · DFlash 不划算</text>

<!-- 代码: 76.4 / 76.3 -->
<rect class="s1" x="480" y="113.3" width="60" height="146.7" rx="4"/>
<rect class="s2" x="542" y="113.5" width="60" height="146.5" rx="4"/>
<text class="tp" x="510" y="106" font-size="12" text-anchor="middle" font-weight="600">76.4%</text>
<text class="tp" x="572" y="106" font-size="12" text-anchor="middle" font-weight="600">76.3%</text>
<text class="ts" x="541" y="284" font-size="12" text-anchor="middle">长 Python 模块</text>
<text class="tm" x="541" y="302" font-size="11" text-anchor="middle">每轮产出 4.23 token · DFlash 大幅领先</text>

<text class="ts" x="24" y="328" font-size="11">同一任务下两种权重的接受率几乎相同 —— abliteration 改的是「要不要拒绝回答」，不是「怎么写 Python」。</text>
</svg>
